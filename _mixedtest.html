<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>mixed content probe</title></head>
<body>
<div id="TEST_RESULT" data-r="pending"></div>
<script>
(function(){
  const el = document.getElementById("TEST_RESULT");
  const done = s => { el.setAttribute("data-r", s); };
  if(!window.isSecureContext){ done("not-secure-context"); return; }
  fetch("http://127.0.0.1:8791/health", {cache:"no-store"})
    .then(r => r.json())
    .then(d => done(d && d.ok ? "loopback-fetch-ok" : "loopback-fetch-bad:" + JSON.stringify(d).slice(0,60)))
    .catch(e => done("loopback-fetch-blocked:" + (e && e.name)));
})();
</script>
</body></html>
